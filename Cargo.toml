[package]
name = "wxgeo"
version = "0.2.0"
edition = "2021"
description = "WeChat built-in browser geolocation spoofer (MITM proxy + TUI)"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
crossterm = "0.28"
socket2 = "0.5"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = "s"
lto = true
strip = true
